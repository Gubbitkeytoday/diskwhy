[package]
name = "diskwhy"
version = "0.1.0"
description = "DiskWhy — find out why your disk is full"
edition = "2024"
rust-version = "1.90"

[lib]
name = "diskwhy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }
trash = "5.2"
# AI advisor (Claude API over HTTPS; key kept in Windows Credential Manager)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
futures = "0.3"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
# Installed-programs list (uninstall registry keys) for orphaned-AppData detection
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
