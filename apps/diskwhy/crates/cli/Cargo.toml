[package]
name = "diskwhy-cli"
description = "DiskWhy CLI + MCP server: lets Claude Code / Claude Desktop scan, diagnose and clean a Windows disk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "diskwhy_cli"
path = "src/lib.rs"

[[bin]]
name = "diskwhy-cli"
path = "src/main.rs"

[dependencies]
diskwhy-core = { path = "../core" }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std", "sync"] }
clap = { version = "4", features = ["derive", "wrap_help"] }

[dev-dependencies]
tempfile = "3"
