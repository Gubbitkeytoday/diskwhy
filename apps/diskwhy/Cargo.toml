[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"

# Keep dev/test builds small: full debug info for third-party crates (tauri, rmcp, …) costs many GB on disk.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
